<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta | HORNERO CARS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/css/global.css">
    <link rel="stylesheet" href="../static/css/registro.css"> 
    <link rel="stylesheet" href="../static/css/styles.css"> 
</head>
<body class="registro-page">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="../index.html">HORNERO CARS</a>
            <ul class="navbar-nav ms-auto">
                 <li class="nav-item">
                    <a class="nav-link" href="login.html">Iniciar Sesión</a> </li>
            </ul>
        </div>
    </nav>

    <main class="container flex-grow-1 py-4"> <!--py-4 para un poco de padding vertical en main -->
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7 col-xl-6"> <!--Ajuste de columnas para diferentes tamaños */} -->
                <div class="registration-container">
                    <h2>Crear Nueva Cuenta</h2>
                    <form id="formRegistro">
                        <h5 class="text-muted mb-3">Información Personal</h5>
                        <div class="mb-3">
                            <label for="nombreCompleto" class="form-label">Nombre Completo <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nombreCompleto" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label">Contraseña <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="confirmPassword" class="form-label">Confirmar Contraseña <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Número de Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" placeholder="Ej: +5491112345678">
                        </div>
                        <div class="mb-4">
                            <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="fechaNacimiento">
                        </div>

                        <hr class="my-4" style="border-top: 1px solid #495057;"> <!-- Separador visual */ -->

                        <h5 class="text-muted mb-3">Documentación (Opcional al registrar)</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="dniNumero" class="form-label">Número de DNI</label>
                                <input type="text" class="form-control" id="dniNumero">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="licenciaNumero" class="form-label">Número de Licencia de Conducir</label>
                                <input type="text" class="form-control" id="licenciaNumero">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="licenciaCategoria" class="form-label">Categoría de Licencia</label>
                                <input type="text" class="form-control" id="licenciaCategoria" placeholder="Ej: B1, B2">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="licenciaVencimiento" class="form-label">Vencimiento Licencia</label>
                            <input type="date" class="form-control" id="licenciaVencimiento">
                        </div>
                        
                        <div class="d-grid gap-2 mt-4">  <!-- mt-4 para espacio antes del botón-->
                            <button type="submit" class="btn btn-custom-register btn-lg">Crear Cuenta</button>
                        </div>
                    </form>
                    <p class="mt-4 text-center">
                        ¿Ya tienes una cuenta? <a href="login.html" class="login-link fw-bold">Iniciar Sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">&copy; <span id="currentYear"></span> HORNERO CARS. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN
