<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="../static/css/dashboardAdmin.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/css/global.css">
</head>

<body>
    <header>

    </header>

    <div class="dashboardAdmin">
        <aside>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-primary text-start" aria-current="page" href="#">Gestión de
                        Sucursales</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-primary text-start" href="#">Gestión de Vehículos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-primary text-start" href="#">Gestión de Reservas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-primary text-start" href="#">Consultas y Reportes</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle btn btn-outline-primary text-start" data-bs-toggle="dropdown"
                        href="#" role="button" aria-expanded="false">Usuario</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Cerrar Sesión</a></li>
                </li>
            </ul>
        </aside>

        <main>
            <div>
                <h2 class="progreso">Progreso</h2>
                <div class="progress" role="progressbar" aria-label="Success example" aria-valuenow="25"
                    aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-success" style="width: 25%"></div>
                </div><br>
                <div class="progress" role="progressbar" aria-label="Info example" aria-valuenow="50" aria-valuemin="0"
                    aria-valuemax="100">
                    <div class="progress-bar bg-info" style="width: 50%"></div>
                </div><br>
                <div class="progress" role="progressbar" aria-label="Warning example" aria-valuenow="75"
                    aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-warning" style="width: 75%"></div>
                </div><br>
                <div class="progress" role="progressbar" aria-label="Danger example" aria-valuenow="100"
                    aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-danger" style="width: 100%"></div>
                </div>
            </div>
        </main>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
